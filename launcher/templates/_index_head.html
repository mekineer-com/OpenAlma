<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page_title|default("OpenAlma") }}</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: dark; font-size: 15px; }
    body {
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      line-height: 1.42;
      width: min(92vw, 850px);
      margin: 1rem auto;
      padding: 0 0.5rem;
      box-sizing: border-box;
      background: #181818;
      color: #ddd;
    }
    h1 { margin: 0 0 0.5rem 0; color: #f0f0f0; }
    h2 { border-bottom: 1px solid #333; padding-bottom: 0.3rem; margin-top: 2rem; color: #f0f0f0; }
    p.muted, .muted { color: #888; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 0.35rem 0.4rem; text-align: left; border-bottom: 1px solid #2a2a2a; vertical-align: middle; }
    th { font-weight: 600; background: #222; color: #eee; }
    details.excluded-chats { margin-top: 0.8rem; }
    details.excluded-chats summary { cursor: pointer; color: #aaa; margin-bottom: 0.4rem; }
    details.not-installed { margin-top: 0.8rem; }
    details.not-installed summary { cursor: pointer; color: #aaa; }
    details.not-installed ul { margin: 0.5rem 0 0; padding-left: 1.4rem; color: #aaa; }
    .running, .healthy, .ready, .active { color: #4ade80; font-weight: 600; }
    .starting { color: #fbbf24; font-weight: 600; }
    .degraded, .transcript_gap { color: #fb923c; font-weight: 600; }
    .disabled { color: #888; }
    .blocked, .orphaned, .stuck { color: #fb923c; font-weight: 600; }
    .stopped { color: #f87171; }
    .svc-detail { margin-top: 0.15rem; font-size: 0.78rem; color: #aaa; }
    .svc-children { margin-top: 0.15rem; font-size: 0.78rem; color: #888; }
    .btn { display: inline-block; padding: 0.25rem 0.55rem; font: inherit; cursor: pointer; text-decoration: none;
           background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 3px; }
    .btn:hover { background: #353535; border-color: #555; }
    .btn:disabled { opacity: 0.7; cursor: progress; }
    form.inline { display: inline; margin: 0; }
    .svc-actions { white-space: nowrap; }
    .svc-actions + td { padding-left: 0.55rem; }
    select { font: inherit; padding: 0.15rem 0.25rem; background: #2a2a2a; color: #eee; border: 1px solid #444; }
    a { color: #7cb7ff; }
    a:visited { color: #b18cd9; }
    code { background: #2a2a2a; color: #f0f0f0; padding: 0.05rem 0.3rem; border-radius: 3px; font-size: 0.9em; }
    .spinner {
      display: inline-block;
      width: 0.85em;
      height: 0.85em;
      border: 2px solid transparent;
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .banner { padding: 0.6rem 0.8rem; margin: 1rem 0; border-radius: 3px;
              background: #3a2415; color: #f5c084; border: 1px solid #6b3a16; }
    .meter { width: 100%; max-width: 28rem; height: 0.6rem; background: #2a2a2a;
             border: 1px solid #444; border-radius: 3px; overflow: hidden; }
    .meter-fill { height: 100%; background: #6aa9ff; }
    #memorize-meter p { margin: 0.35rem 0; }
    .badge { display: inline-block; margin-left: 0.4rem; padding: 0.1rem 0.45rem; border-radius: 3px;
             background: #3a2415; color: #f5c084; border: 1px solid #6b3a16; font-size: 0.78rem; }
    .consolidation-warning { padding: 0.45rem 0.6rem; margin: 0.65rem 0; border-radius: 3px;
                             background: #3a2415; color: #f5c084; border: 1px solid #6b3a16; }
    .soul-entry { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 0.35rem; }
    .soul-combobox { position: relative; display: inline-block; }
    .soul-combobox input { font: inherit; padding: 0.2rem 0.35rem; background: #2a2a2a; color: #eee;
                           border: 1px solid #444; border-radius: 3px; min-width: 18rem; }
    .soul-options { position: absolute; z-index: 2; top: 100%; left: 0; right: 0; display: grid;
                    background: #222; border: 1px solid #444; box-shadow: 0 0.35rem 0.8rem #0008; }
    .soul-options[hidden] { display: none; }
    .soul-options button { padding: 0.35rem; text-align: left; font: inherit; color: #eee;
                           background: transparent; border: 0; cursor: pointer; }
    .soul-options button:hover, .soul-options button:focus { background: #353535; }
    .soul-ready { color: #4ade80; font-weight: 700; }
    .soul-new { flex-basis: 100%; color: #fbbf24; }
  </style>
</head>
<body>
