<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page_title|default("Settings") }} — OpenAlma</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    :root { color-scheme: dark; font-size: 15px; }
    body {
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      line-height: 1.42;
      width: min(92vw, 850px);
      margin: 1rem auto;
      padding: 0 0.5rem;
      box-sizing: border-box;
      background: #181818;
      color: #ddd;
    }
    h1 { margin: 0 0 0.5rem 0; color: #f0f0f0; }
    h2 { border-bottom: 1px solid #333; padding-bottom: 0.3rem; margin-top: 2rem; color: #f0f0f0; }
    p.muted, .muted { color: #888; }
    label { display: block; margin: 1rem 0 0.3rem 0; color: #eee; }
    input[type=text] { width: 100%; box-sizing: border-box; font: inherit;
                       padding: 0.4rem 0.5rem; background: #2a2a2a; color: #eee;
                       border: 1px solid #444; border-radius: 3px; }
    .btn { padding: 0.4rem 0.9rem; font: inherit; cursor: pointer;
           background: #2a2a2a; color: #eee; border: 1px solid #444; border-radius: 3px; }
    .btn:hover { background: #353535; border-color: #555; }
    a { color: #7cb7ff; }
    a:visited { color: #b18cd9; }
    code { background: #2a2a2a; color: #f0f0f0; padding: 0.05rem 0.3rem; border-radius: 3px; font-size: 0.9em; }
    .hint { font-size: 0.9em; color: #999; margin-top: 0.3rem; }
    form.inline { display: inline; margin: 0; }
    .tight li { margin: 0.3rem 0; }
    .checklist { list-style: none; padding: 0; }
    .checklist li { padding: 0.45rem 0; border-bottom: 1px solid #2a2a2a; }
    .ready { color: #4ade80; }
    .failure { color: #f87171; }
    .unknown { color: #888; }
    .iris-rename summary { width: fit-content; list-style: none; font-weight: bold; cursor: pointer; }
    .iris-rename summary::-webkit-details-marker { display: none; }
    .iris-rename summary:focus-visible { outline: 2px solid #7cb7ff; outline-offset: 2px; }
    #iris-install-qr { width: 220px; height: 220px; background: #fff; border: 8px solid #fff; display: block; }
  </style>
</head>
<body>
