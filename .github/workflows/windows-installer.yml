name: Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Optional numeric version for pre-tag candidate testing (for example v0.1.16)
        required: false
        default: ""
        type: string

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BUILD_REF_TYPE: ${{ github.ref_type }}
      BUILD_REF_NAME: ${{ github.ref_name }}
      CANDIDATE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_version || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install launcher test dependencies
        run: python -m pip install --disable-pip-version-check -r launcher/requirements.txt pytest httpx
      - name: Test launcher
        run: |
          python -m pytest -q tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s launcher -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Select installer version
        shell: pwsh
        run: |
          if ($env:BUILD_REF_TYPE -eq "tag") {
            $tag = $env:BUILD_REF_NAME
          } elseif ($env:CANDIDATE_VERSION) {
            if ($env:CANDIDATE_VERSION -cnotmatch '\Av[0-9]+\.[0-9]+\.[0-9]+\z') { throw 'Use a numeric candidate version such as v0.1.16' }
            $tag = $env:CANDIDATE_VERSION
          } else {
            $tag = 'v0.0.0-dev'
          }
          if ($tag -notmatch '^v[A-Za-z0-9][A-Za-z0-9._-]{0,126}$') { throw "Invalid release tag: $tag" }
          "INSTALLER_VERSION=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Stage Bun and corresponding-source materials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python installer/windows/stage_bun.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer
        shell: pwsh
        run: |
          $tag = $env:INSTALLER_VERSION
          if ($env:BUILD_REF_TYPE -eq "tag" -or $env:CANDIDATE_VERSION) {
            $manifest = Get-Content release-components.json | ConvertFrom-Json
            $repositories = $manifest.services.psobject.Properties |
              ForEach-Object { $_.Value.repositories }
            foreach ($repository in $repositories) {
              $ref = if ($repository.ref -eq '$OPENALMA_RELEASE_TAG') { $tag } else { $repository.ref }
              git ls-remote --exit-code --tags $repository.repository "refs/tags/$ref" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Missing $ref in $($repository.repository)" }
            }
          }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not installed" }
          & $iscc.FullName "/DMyAppVersion=$tag" installer/windows/OpenAlma.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAlma-Windows-installer
          path: installer/windows/output/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAlma-Bun-corresponding-source
          path: installer/windows/output/bun-sources/
          compression-level: 0
          if-no-files-found: error
