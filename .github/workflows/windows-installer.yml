name: Windows installer

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install launcher test dependencies
        run: python -m pip install --disable-pip-version-check -r launcher/requirements.txt pytest httpx2
      - name: Test launcher
        run: python -m pytest -q tests
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build installer
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "v0.0.0-dev" }
          if ($tag -notmatch '^v[A-Za-z0-9][A-Za-z0-9._-]{0,126}$') { throw "Invalid release tag: $tag" }
          if ("${{ github.ref_type }}" -eq "tag") {
            $manifest = Get-Content release-components.json | ConvertFrom-Json
            $repositories = $manifest.services.psobject.Properties |
              ForEach-Object { $_.Value.repositories } |
              Where-Object { $_.ref -eq '$OPENALMA_RELEASE_TAG' }
            foreach ($repository in $repositories) {
              git ls-remote --exit-code --tags $repository.repository "refs/tags/$tag" | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Missing $tag in $($repository.repository)" }
            }
          }
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe was not installed" }
          & $iscc.FullName "/DMyAppVersion=$tag" installer/windows/OpenAlma.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OpenAlma-Windows-installer
          path: installer/windows/output/*.exe
